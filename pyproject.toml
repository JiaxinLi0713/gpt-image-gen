[project]
name = "gpt-image-gen"
version = "0.1.0"
description = "Browser-based multimodal image generation via gpt-image-2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<0.120",
    "openai>=1.50,<2.0",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
